name: cameras
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    paths: [".github/workflows/cameras.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download cameras of Ukraine from OpenStreetMap
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, datetime, sys
          q = """[out:json][timeout:300];
          area["ISO3166-1"="UA"][admin_level=2]->.a;
          (node["highway"="speed_camera"](area.a);
           node["enforcement"](area.a);
           node["device"="red_light_camera"](area.a);
           relation["type"="enforcement"](area.a););
          out center tags;"""
          data = None
          for u in ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter", "https://maps.mail.ru/osm/tools/overpass/api/interpreter"]:
              try:
                  req = urllib.request.Request(u, data=urllib.parse.urlencode({"data": q}).encode(), headers={"User-Agent": "obyezd-cameras"})
                  data = json.load(urllib.request.urlopen(req, timeout=400))
                  break
              except Exception as e:
                  print("fail", u, e)
          if not data:
              sys.exit(1)
          out, seen = [], set()
          for e in data["elements"]:
              lat = e.get("lat") or (e.get("center") or {}).get("lat")
              lon = e.get("lon") or (e.get("center") or {}).get("lon")
              if lat is None:
                  continue
              t = e.get("tags", {})
              enf = t.get("enforcement", "")
              kind = "red" if enf == "traffic_signals" or t.get("device") == "red_light_camera" else "avg" if enf == "average_speed" else "speed" if enf in ("", "maxspeed") else "other"
              try:
                  ms = int(str(t.get("maxspeed", "0")).split()[0])
              except Exception:
                  ms = 0
              k = (round(lat, 5), round(lon, 5))
              if k in seen:
                  continue
              seen.add(k)
              out.append([round(lat, 6), round(lon, 6), kind, ms])
          json.dump({"updated": datetime.datetime.utcnow().isoformat() + "Z", "list": out}, open("cameras.json", "w"), separators=(",", ":"))
          print(len(out), "cameras")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cameras.json
          git diff --cached --quiet || (git commit -m "Update cameras" && git push)
