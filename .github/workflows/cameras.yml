name: cameras
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    paths: [".github/workflows/cameras.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download cameras of Ukraine from OpenStreetMap
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, datetime, sys
          q = """[out:json][timeout:300];
          area["ISO3166-1"="UA"][admin_level=2]->.a;
          (node["highway"="speed_camera"](area.a);
           node["enforcement"](area.a);
           node["device"="red_light_camera"](area.a);
           relation["type"="enforcement"](area.a););
          out center tags;"""
          data = None
          for u in ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter", "https://maps.mail.ru/osm/tools/overpass/api/interpreter"]:
              try:
                  req = urllib.request.Request(u, data=urllib.parse.urlencode({"data": q}).encode(), headers={"User-Agent": "obyezd-cameras"})
                  data = json.load(urllib.request.urlopen(req, timeout=400))
                  break
              except Exception as e:
                  print("fail", u, e)
          if not data:
              sys.exit(1)
          out, seen = [], set()
          for e in data["elements"]:
              lat = e.get("lat") or (e.get("center") or {}).get("lat")
              lon = e.get("lon") or (e.get("center") or {}).get("lon")
              if lat is None:
                  continue
              t = e.get("tags", {})
              enf = t.get("enforcement", "")
              kind = "red" if enf == "traffic_signals" or t.get("device") == "red_light_camera" else "avg" if enf == "average_speed" else "speed" if enf in ("", "maxspeed") else "other"
              try:
                  ms = int(str(t.get("maxspeed", "0")).split()[0])
              except Exception:
                  ms = 0
              k = (round(lat, 5), round(lon, 5))
              if k in seen:
                  continue
              seen.add(k)
              out.append([round(lat, 6), round(lon, 6), kind, ms])
          json.dump({"updated": datetime.datetime.utcnow().isoformat() + "Z", "list": out}, open("cameras.json", "w"), separators=(",", ":"))
          print(len(out), "cameras")
          PY
      - name: Download places and traffic lights of Ukraine from OpenStreetMap
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, datetime, sys
          def ask(q):
              for u in ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter", "https://maps.mail.ru/osm/tools/overpass/api/interpreter"]:
                  try:
                      req = urllib.request.Request(u, data=urllib.parse.urlencode({"data": q}).encode(), headers={"User-Agent": "obyezd-pois"})
                      return json.load(urllib.request.urlopen(req, timeout=600))
                  except Exception as e:
                      print("fail", u, e)
              return None
          A = 'area["ISO3166-1"="UA"][admin_level=2]->.a;'
          q = "[out:json][timeout:600];" + A + """(
           nwr["amenity"="fuel"](area.a);
           nwr["amenity"="charging_station"](area.a);
           nwr["shop"="car_repair"](area.a);
           nwr["shop"="tyres"](area.a);
           nwr["amenity"="car_wash"](area.a);
           node["railway"="level_crossing"](area.a);
           nwr["amenity"="school"](area.a);
           nwr["shop"="mall"](area.a);
           nwr["amenity"="marketplace"](area.a););
          out center tags;"""
          d = ask(q)
          if d:
              out = []
              for e in d["elements"]:
                  lat = e.get("lat") or (e.get("center") or {}).get("lat")
                  lon = e.get("lon") or (e.get("center") or {}).get("lon")
                  if lat is None:
                      continue
                  t = e.get("tags", {})
                  k = ("fuel" if t.get("amenity") == "fuel" else "ev" if t.get("amenity") == "charging_station" else "repair" if t.get("shop") == "car_repair"
                       else "tyres" if t.get("shop") == "tyres" else "wash" if t.get("amenity") == "car_wash" else "lc" if t.get("railway") == "level_crossing"
                       else "school" if t.get("amenity") == "school" else "mall")
                  name = t.get("name:ru") or t.get("name") or t.get("brand") or ""
                  out.append([round(lat, 6), round(lon, 6), k, name[:40]])
              json.dump({"updated": datetime.datetime.utcnow().isoformat() + "Z", "list": out}, open("pois.json", "w"), ensure_ascii=False, separators=(",", ":"))
              print(len(out), "places")
          s = ask("[out:json][timeout:600];" + A + 'node["highway"~"^(traffic_signals|stop)$"](area.a);out;')
          if s:
              out = [[round(e["lat"], 6), round(e["lon"], 6), "stop" if e.get("tags", {}).get("highway") == "stop" else "sig"] for e in s["elements"]]
              json.dump({"updated": datetime.datetime.utcnow().isoformat() + "Z", "list": out}, open("signals.json", "w"), separators=(",", ":"))
              print(len(out), "signals")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in cameras.json pois.json signals.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && exit 0
          git commit -m "Update cameras and places"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 10; done
          exit 1
